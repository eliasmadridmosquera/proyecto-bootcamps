name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Preparar pnpm
        uses: pnpm/action-setup@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar calidad con ESLint
        run: pnpm lint

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Compilar
        run: pnpm build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          # URL pública de la Lambda; vacía = simulador
          VITE_IA_API_URL: ${{ vars.VITE_IA_API_URL }}

      - name: Guardar artefacto dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  deploy:
    name: Desplegar en S3
    needs: quality
    # solo al integrar en main; los Pull Request se validan pero no se publican
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: despliegue-s3
      cancel-in-progress: false
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Autenticar en AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sincronizar con Amazon S3
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: aws s3 sync dist/ "s3://$BUCKET" --delete
